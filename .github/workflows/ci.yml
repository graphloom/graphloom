name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lockfile ban check (ADR-0006)
        run: node tools/check-lockfile-bans.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Build & test (affected on PRs)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t build test --base=origin/${{ github.base_ref }}
          else
            pnpm exec nx run-many -t build test
          fi
      - name: Package health (publint + attw)
        if: matrix.node-version == 24
        run: pnpm pkgcheck
      - name: Tree-shaking probe
        if: matrix.node-version == 24
        run: node tools/check-treeshake.mjs

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The examples app imports built package dists (P3-T10).
      - run: pnpm exec nx run-many -t build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      # On failure the report + test-results carry actual screenshots — used
      # to bootstrap/refresh visual baselines (download, review, commit).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Phase Gate G6 (P9-T03): the full ADR-0007 frame budget, its own job so a
  # slow runner never slows `checks`/`e2e-smoke`. Chromium only, one hardware
  # profile — the budget is pinned to it.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm bench
      # Writes bench-results/benchmark.json (trend format), then fails the job
      # on an ADR-0007 budget breach or >10% run-to-run variance.
      - name: ADR-0007 budget + variance gate
        run: pnpm bench:report
      # Every run's numbers + the trend-format file are kept as an artifact
      # (90-day retention = the persisted trend for now; a github-action-
      # benchmark dashboard on top is a P9-T03 follow-up once this is green).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-metrics
          path: |
            bench-results/
            playwright-report/
